[project]
name = "project-manager"
version = "0.1.0"
description = "Claim-release pool of git worktrees bound to named projects via symlinks."
readme = "README.md"
authors = [
    { name = "Jordan Isaacs", email = "jordan@snowytrees.dev" }
]
requires-python = ">=3.11"
dependencies = [
    "cyclopts>=4.10,<5",
    "rich>=14,<15",
]

[project.scripts]
pm = "project_manager.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Parallel test execution. Each test uses an isolated `pm_env` tmp dir
    # (see tests/conftest.py), so workers can't stomp each other.
    "pytest-xdist>=3.6",
    "ruff>=0.8",
    "ty>=0.0.1a1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Docstring enforcement across the project is noise for a small CLI.
    "D",
    # Trailing-comma rules conflict with the formatter.
    "COM812",
    # Copyright headers.
    "CPY",
    # print() is how the CLI talks to stdout.
    "T201",
    # Allow Exception subclasses without a trailing period in the message.
    "EM101", "EM102",
    # Allow implicit Optional via `X | None` — we already require 3.11.
    "TC",
    # Don't require from __future__ import annotations.
    "FA",
    # Too-long messages in raise — we prefer expressive errors.
    "TRY003",
    # Using assert in tests is fine.
    "S101",
    # subprocess calls are deliberate and vetted.
    "S603", "S607",
    # Cyclopts commands pass frozen dataclasses as defaults; B008 would flag
    # the `RepoFlag()` / `StackerScope()` pattern that cyclopts requires.
    "B008",
    # TODO comments don't need per-comment author/issue-link metadata —
    # this project has no issue tracker plumbed into the source.
    "TD002", "TD003", "FIX002",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN",   # tests don't need full annotation coverage
    "PLR2004",  # magic numbers in tests are expected
    "SLF001",   # tests may poke at privates
    "PLC0415",  # inline imports are fine in tests
]
# Cyclopts handlers naturally take many typed parameters (scope dataclass +
# individual flags) and receive bool flags via keyword-only args; the lint
# rules below are designed for conventional functions and produce noise here.
"src/project_manager/*/cli/**" = ["PLR0913"]
"src/project_manager/cli/*" = ["PLR0913"]
"src/project_manager/stacker/commands/*" = ["PLR0913", "C901", "FBT001", "FBT002"]
# The `pm serve` fallback poller is a supervisor loop: it must catch any
# poll failure (IO, sqlite, asyncio TaskGroup) and keep going rather than let
# the background thread die, so a blind `except Exception` is correct here.
"src/project_manager/agent/serve/fallback.py" = ["BLE001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ty is maximal via `[tool.ty.terminal] error-on-warning`. This picks up every
# default-warn rule automatically, including any added in future ty releases —
# no hand-maintained list to drift.
[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-n auto` spreads tests across as many workers as CPU cores. Each test
# gets its own tmp_path-backed `pm_env`, so workers can't collide.
addopts = "-n auto"
